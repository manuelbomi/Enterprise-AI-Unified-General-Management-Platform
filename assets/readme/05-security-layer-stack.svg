<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Enterprise security layers visual">
  <defs>
    <linearGradient id="bg" x1="90" y1="70" x2="1510" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1E24"/>
      <stop offset="0.48" stop-color="#123B3A"/>
      <stop offset="1" stop-color="#29401D"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#030712" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.2">
    <circle cx="1260" cy="110" r="210" fill="#34D399"/>
    <circle cx="280" cy="780" r="230" fill="#84CC16"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="80" width="1420" height="740" rx="30" fill="#0B2A2B" fill-opacity="0.68"/>
    <rect x="90.5" y="80.5" width="1419" height="739" rx="29.5" stroke="url(#glass)"/>
  </g>

  <text x="150" y="160" fill="#BBF7D0" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="1.3">ZERO-TRUST PROTECTION MODEL</text>
  <text x="150" y="214" fill="#F8FAFC" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="56" font-weight="700">Security Layer Stack</text>
  <text x="150" y="255" fill="#D9F99D" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="22" font-weight="500">Prompt defense, tenant isolation, model verification, and runtime governance</text>

  <rect x="150" y="300" width="260" height="74" rx="16" fill="#1F2937"/>
  <text x="181" y="345" fill="#86EFAC" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="28" font-weight="700">99.4% blocked</text>

  <rect x="425" y="300" width="260" height="74" rx="16" fill="#1F2937"/>
  <text x="456" y="345" fill="#A3E635" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="28" font-weight="700">4 trust zones</text>

  <rect x="700" y="300" width="260" height="74" rx="16" fill="#1F2937"/>
  <text x="731" y="345" fill="#6EE7B7" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="28" font-weight="700">24/7 telemetry</text>

  <g filter="url(#shadow)">
    <rect x="150" y="420" width="1260" height="322" rx="24" fill="#102E31"/>
    <rect x="150.5" y="420.5" width="1259" height="321" rx="23.5" stroke="#4ADE80" stroke-opacity="0.45"/>
  </g>

  <text x="184" y="468" fill="#BBF7D0" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="20" font-weight="600">Defense-in-Depth Flow</text>

  <rect x="184" y="505" width="190" height="188" rx="18" fill="#134E4A"/>
  <text x="204" y="541" fill="#99F6E4" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700">Layer 1</text>
  <text x="204" y="571" fill="#ECFDF5" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="22" font-weight="700">Prompt Guard</text>
  <text x="204" y="604" fill="#A7F3D0" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">Injection patterns</text>
  <text x="204" y="625" fill="#A7F3D0" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">Policy rewriting</text>

  <rect x="398" y="505" width="190" height="188" rx="18" fill="#14532D"/>
  <text x="418" y="541" fill="#86EFAC" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700">Layer 2</text>
  <text x="418" y="571" fill="#F0FDF4" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="22" font-weight="700">Tenant Gate</text>
  <text x="418" y="604" fill="#BBF7D0" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">RBAC + ABAC</text>
  <text x="418" y="625" fill="#BBF7D0" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">Context scoping</text>

  <rect x="612" y="505" width="190" height="188" rx="18" fill="#365314"/>
  <text x="632" y="541" fill="#BEF264" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700">Layer 3</text>
  <text x="632" y="571" fill="#F7FEE7" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="22" font-weight="700">Model Check</text>
  <text x="632" y="604" fill="#D9F99D" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">Signature verify</text>
  <text x="632" y="625" fill="#D9F99D" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">SBOM attestation</text>

  <rect x="826" y="505" width="190" height="188" rx="18" fill="#3F6212"/>
  <text x="846" y="541" fill="#D9F99D" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700">Layer 4</text>
  <text x="846" y="571" fill="#FEFCE8" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="22" font-weight="700">RAG Filter</text>
  <text x="846" y="604" fill="#ECFCCB" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">Document ACLs</text>
  <text x="846" y="625" fill="#ECFCCB" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">Citation policy</text>

  <rect x="1040" y="505" width="190" height="188" rx="18" fill="#4D7C0F"/>
  <text x="1060" y="541" fill="#D9F99D" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700">Layer 5</text>
  <text x="1060" y="571" fill="#FEFCE8" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="22" font-weight="700">Audit Trail</text>
  <text x="1060" y="604" fill="#ECFCCB" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">Immutable events</text>
  <text x="1060" y="625" fill="#ECFCCB" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">Risk scoring</text>

  <path d="M374 598H398" stroke="url(#accent)" stroke-width="4"/>
  <path d="M588 598H612" stroke="url(#accent)" stroke-width="4"/>
  <path d="M802 598H826" stroke="url(#accent)" stroke-width="4"/>
  <path d="M1016 598H1040" stroke="url(#accent)" stroke-width="4"/>

  <rect x="1248" y="505" width="144" height="188" rx="18" fill="#0F172A"/>
  <text x="1270" y="550" fill="#6EE7B7" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700">Outcome</text>
  <text x="1269" y="586" fill="#F0FDF4" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="24" font-weight="700">Trusted</text>
  <text x="1269" y="619" fill="#D9F99D" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="24" font-weight="700">Responses</text>

  <rect x="150" y="778" width="430" height="34" rx="17" fill="#14532D"/>
  <text x="175" y="800" fill="#BBF7D0" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14" font-weight="600">Composable security controls for enterprise AI operations</text>
</svg>
